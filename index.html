<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Interactive Floor Map</title>
<style>
html,body{margin:0;height:100%;background:#fff}
.fm{--b:#009edb;--d:#0b3d5c;position:relative;width:100%;height:var(--fm-h,100%);min-height:480px;background:#fff;font:14px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;color:#131d29;overflow:hidden;-webkit-user-select:none;user-select:none}
.fm *{box-sizing:border-box}
.fm-svg{position:absolute;inset:0;width:100%;height:100%;touch-action:pan-y;cursor:grab}
.fm.zoomed .fm-svg{touch-action:none}
.fm-svg:active{cursor:grabbing}
.fm-svg text{font-family:inherit;font-weight:500;pointer-events:none}
.fm-svg .room{pointer-events:all;cursor:pointer;outline:none;transition:opacity .2s}
.fm-svg .dim{opacity:.25;transition:opacity .2s}
.fm-svg .poi{fill:transparent;pointer-events:all;cursor:pointer;outline:none}
.fm.am .poi{fill:rgba(0,158,219,.15);stroke:var(--b);stroke-width:3;stroke-dasharray:8 6}
.fm-hv,.fm-sel{pointer-events:none;stroke-linejoin:round}
.fm-hv{fill:rgba(0,158,219,.18);stroke:var(--b);stroke-width:5}
.fm-sel{fill:rgba(0,158,219,.28);stroke:var(--d);stroke-width:8}
.fm-pulse{fill:#39b54a;opacity:.5;transform-box:fill-box;transform-origin:center;animation:fmp 1.8s ease-out infinite;pointer-events:none}
@keyframes fmp{to{transform:scale(3.2);opacity:0}}
.fm-bar{position:absolute;top:10px;left:10px;right:10px;display:flex;flex-wrap:wrap;gap:8px;align-items:flex-start;pointer-events:none}
.fm-bar>*{pointer-events:auto}
.fm-sw{position:relative;width:220px;max-width:100%}
.fm input{width:100%;padding:9px 12px;border:1px solid #b9d9e8;border-radius:10px;font:inherit;background:#fff;box-shadow:0 1px 4px rgba(0,0,0,.12);-webkit-user-select:text;user-select:text}
.fm-res{position:absolute;top:100%;left:0;right:0;margin:4px 0 0;padding:4px;list-style:none;background:#fff;border-radius:10px;box-shadow:0 4px 14px rgba(0,0,0,.2);z-index:5}
.fm-res li{padding:7px 10px;border-radius:6px;cursor:pointer}
.fm-res li:hover{background:#e6f4fb}
.fm-chips{display:flex;flex-wrap:wrap;gap:6px}
.fm button{font:inherit;cursor:pointer}
.fm-chip{padding:7px 12px;border:1px solid #b9d9e8;border-radius:99px;background:#fff;color:inherit;box-shadow:0 1px 4px rgba(0,0,0,.1)}
.fm-chip[aria-pressed=true]{background:var(--b);border-color:var(--b);color:#fff}
.fm-zoom{position:absolute;right:10px;bottom:10px;display:flex;flex-direction:column;gap:6px}
.fm-zoom button{width:38px;height:38px;border:1px solid #b9d9e8;border-radius:10px;background:#fff;color:inherit;font-size:20px;line-height:1;box-shadow:0 1px 4px rgba(0,0,0,.15)}
.fm-tip{position:absolute;pointer-events:none;background:#131d29;color:#fff;padding:4px 9px;border-radius:6px;font-size:13px;opacity:0;transition:opacity .1s;white-space:nowrap;z-index:6}
.fm-tip.on{opacity:1}
.fm-panel{position:absolute;left:10px;bottom:10px;width:min(320px,calc(100% - 70px));background:#fff;border-radius:14px;border-top:5px solid var(--b);padding:14px 16px;box-shadow:0 6px 24px rgba(0,0,0,.22);display:none}
.fm-panel.on{display:block}
.fm-panel h3{margin:0 28px 6px 0;font-size:18px}
.fm-badge{display:inline-block;font-size:12px;padding:2px 9px;border-radius:99px;background:#e6f4fb;color:var(--d)}
.fm-panel p{margin:8px 0 0}
.fm-panel dl{display:grid;grid-template-columns:auto 1fr;gap:2px 10px;margin:8px 0 0}
.fm-panel dt{color:#5b6b78;text-transform:capitalize}
.fm-panel dd{margin:0}
.fm-x{position:absolute;top:8px;right:10px;border:0;background:none;font-size:22px;line-height:1;color:#5b6b78}
.fm-go{margin-top:10px;padding:7px 12px;border:0;border-radius:8px;background:var(--b);color:#fff}
.fm-hint{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);background:rgba(19,29,41,.85);color:#fff;padding:8px 14px;border-radius:8px;opacity:0;transition:opacity .25s;pointer-events:none}
.fm-hint.on{opacity:1}
</style>
</head>

75.17859047692355" height="100.57000000000244" rx="10" data-name="Water fountain" data-type="fountain" tabindex="0" role="button" aria-label="Water fountain" /><rect class="poi" x="906.8718387228472" y="611.97" width="75.17859047692389" height="100.56999999999982" rx="10" data-name="Water fountain" data-type="fountain" tabindex="0" role="button" aria-label="Water fountain" /><rect class="poi" x="908.5618387228463" y="1865.78" width="75.17859047692468" height="100.57000000000085" rx="10" data-name="Water fountain" data-type="fountain" tabindex="0" role="button" aria-label="Water fountain" /><rect class="poi" x="2253.06" y="951.2699999999999" width="160.07999999999993" height="102.20000000000039" rx="10" data-name="Entrance" data-type="entrance" tabindex="0" role="button" aria-label="Entrance" /><rect class="poi" x="2314.9600000000005" y="1839.1899999999996" width="98.17999999999938" height="102.2000000000005" rx="10" data-name="Entrance" data-type="entrance" tabindex="0" role="button" aria-label="Entrance" /><rect class="poi" x="1800.58" y="2310.06" width="116.0" height="109.5600000000004" rx="10" data-name="Main entrance" data-type="entrance" tabindex="0" role="button" aria-label="Main entrance" /><rect class="poi" x="687.9299999999995" y="617.9900000000001" width="98.19000000000051" height="102.2000000000005" rx="10" data-name="Emergency exit" data-type="exit" tabindex="0" role="button" aria-label="Emergency exit" /><rect class="poi" x="2062.648565481351" y="1855.7000753172988" width="65.86866075053604" height="64.15992468270247" rx="10" data-name="You are here" data-type="here" tabindex="0" role="button" aria-label="You are here" /><circle class="fm-pulse" cx="2095.582895856619" cy="1887.7800376586501" r="26" /></g><g id="fm-ov" /></svg>
<div class="fm-bar">
  <div class="fm-sw"><input id="fm-q" type="search" placeholder="Search rooms…" aria-label="Search rooms" autocomplete="off"><ul class="fm-res" hidden></ul></div>
  <div class="fm-chips" role="group" aria-label="Filter map">
    <button class="fm-chip" data-f="all" aria-pressed="true">All</button>
    <button class="fm-chip" data-f="room" aria-pressed="false">Rooms</button>
    <button class="fm-chip" data-f="lab" aria-pressed="false">Labs</button>
    <button class="fm-chip" data-f="office" aria-pressed="false">Offices</button>
    <button class="fm-chip" data-f="amen" aria-pressed="false">Amenities</button>
  </div>
</div>
<div class="fm-zoom">
  <button data-z="in" aria-label="Zoom in">+</button>
  <button data-z="out" aria-label="Zoom out">−</button>
  <button data-z="reset" aria-label="Reset view">⟲</button>
</div>
<div class="fm-tip"></div>
<div class="fm-hint">Hold Ctrl / ⌘ and scroll to zoom</div>
<div class="fm-panel" aria-live="polite"></div>
</div>
<script>
(()=>{
const R=document.getElementById('floormap'),S=R.querySelector('.fm-svg'),OV=S.querySelector('#fm-ov');

/* ---- EDIT ME: details shown in the info panel, keyed by room name ----
   e.g. "Lab A":{description:"Wet lab",capacity:"24",contact:"ext. 123"} */
const ROOM_INFO={};
const WHEEL_NEEDS_MODIFIER=true; // false = plain scroll wheel always zooms

const LABEL={room:'Room',lab:'Lab',office:'Office / meeting',special:'Room',common:'Common area',amenity:'Amenity',fountain:'Water fountain',entrance:'Entrance',exit:'Emergency exit',here:'You are here'};
const FT={room:['room','special'],lab:['lab'],office:['office'],amen:['amenity','common']};
const base={x:340,y:440,w:2155,h:2060};
let vb={...base};
const $=(s)=>R.querySelector(s);
const rooms=[...S.querySelectorAll('.room')];
const lbl=new Map(rooms.map(r=>[r,[...S.querySelectorAll('[data-for="'+r.id+'"]')]]));
const clamp=(v,a,b)=>Math.min(b,Math.max(a,v));

/* ---- view (pan / zoom via viewBox) ---- */
function draw(){
  vb.w=clamp(vb.w,base.w/8,base.w);vb.h=vb.w*base.h/base.w;
  vb.x=clamp(vb.x,base.x,base.x+base.w-vb.w);vb.y=clamp(vb.y,base.y,base.y+base.h-vb.h);
  S.setAttribute('viewBox',vb.x+' '+vb.y+' '+vb.w+' '+vb.h);
  R.classList.toggle('zoomed',vb.w<base.w*.98);
}
function metrics(){const r=S.getBoundingClientRect(),s=Math.max(vb.w/r.width,vb.h/r.height);return{r,s,ox:(r.width-vb.w/s)/2,oy:(r.height-vb.h/s)/2};}
function toSvg(cx,cy){const m=metrics();return{x:vb.x+(cx-m.r.left-m.ox)*m.s,y:vb.y+(cy-m.r.top-m.oy)*m.s};}
function zoomAt(cx,cy,f){const p=toSvg(cx,cy),w=clamp(vb.w*f,base.w/8,base.w),k=w/vb.w;vb={x:p.x-(p.x-vb.x)*k,y:p.y-(p.y-vb.y)*k,w,h:vb.h*k};draw();}
let raf;
function go(t){cancelAnimationFrame(raf);const a={...vb},t0=performance.now();
  (function f(n){const k=Math.min(1,(n-t0)/350),e=1-Math.pow(1-k,3);
    for(const q of['x','y','w'])vb[q]=a[q]+(t[q]-a[q])*e;
    draw();if(k<1)raf=requestAnimationFrame(f);})(t0);}
function zoomTo(el){const b=el.getBBox(),w=clamp(Math.max(b.width*2.2,b.height*2.2*base.w/base.h,base.w/5),base.w/8,base.w);
  go({x:b.x+b.width/2-w/2,y:b.y+b.height/2-w*base.h/base.w/2,w});}

/* ---- hover / select overlays ---- */
function ghost(el,cls){const g=el.cloneNode(false);
  for(const a of[...g.attributes])if(a.name!=='d'&&!/^(x|y|width|height|rx|ry|cx|cy|r|points|x1|y1|x2|y2|transform)$/.test(a.name))g.removeAttribute(a.name);
  g.setAttribute('class',cls);return g;}
let hv,sl;
function hover(el){if(hv)hv.remove();hv=el?ghost(el,'fm-hv'):null;if(hv)OV.appendChild(hv);}
const tip=$('.fm-tip'),P=$('.fm-panel');
function select(el){
  if(sl)sl.remove();sl=null;P.className='fm-panel';P.replaceChildren();
  if(!el)return;
  sl=ghost(el,'fm-sel');OV.prepend(sl);
  const name=el.dataset.name,info=ROOM_INFO[name]||{},mk=(t,c,x)=>{const e=document.createElement(t);if(c)e.className=c;if(x!=null)e.textContent=x;return e;};
  const x=mk('button','fm-x','×');x.setAttribute('aria-label','Close');x.onclick=()=>select(null);
  P.append(x,mk('h3','',name),mk('span','fm-badge',LABEL[el.dataset.type]||''));
  const{description,...rest}=info;
  if(description)P.append(mk('p','',description));
  const ks=Object.keys(rest);
  if(ks.length){const dl=mk('dl');ks.forEach(k=>dl.append(mk('dt','',k),mk('dd','',rest[k])));P.append(dl);}
  if(el.classList.contains('room')){const g=mk('button','fm-go','Zoom to this room');g.onclick=()=>zoomTo(el);P.append(g);}
  P.classList.add('on');
}

/* ---- filter + search ---- */
let q='',f='all';
function apply(){
  R.classList.toggle('am',f==='amen');
  rooms.forEach(r=>{const ok=(f==='all'||FT[f].includes(r.dataset.type))&&(!q||r.dataset.name.toLowerCase().includes(q));
    r.classList.toggle('dim',!ok);lbl.get(r).forEach(t=>t.classList.toggle('dim',!ok));});
}
R.querySelectorAll('.fm-chip').forEach(c=>c.onclick=()=>{f=c.dataset.f;R.querySelectorAll('.fm-chip').forEach(x=>x.setAttribute('aria-pressed',x===c));apply();});
const qi=$('#fm-q'),res=$('.fm-res');
function pick(r){res.hidden=true;select(r);zoomTo(r);}
qi.addEventListener('input',()=>{
  q=qi.value.trim().toLowerCase();apply();res.replaceChildren();
  const m=q?rooms.filter(r=>r.dataset.name.toLowerCase().includes(q)).slice(0,6):[];
  m.forEach(r=>{const li=document.createElement('li');li.textContent=r.dataset.name;li.onclick=()=>pick(r);res.append(li);});
  res.hidden=!m.length;
});
qi.addEventListener('keydown',e=>{
  if(e.key==='Enter'&&res.firstChild)res.firstChild.click();
  if(e.key==='Escape'){qi.value='';qi.dispatchEvent(new Event('input'));}
});

/* ---- zoom buttons ---- */
R.querySelectorAll('[data-z]').forEach(b=>b.onclick=()=>{
  const z=b.dataset.z;
  if(z==='reset')go({...base});
  else{const r=S.getBoundingClientRect();zoomAt(r.left+r.width/2,r.top+r.height/2,z==='in'?.6:1/.6);}
});

/* ---- pointer: drag-pan, pinch-zoom, click ---- */
const ptr=new Map();let drag=null,moved=false,pd=0;
const pdist=()=>{const[a,b]=[...ptr.values()];return Math.hypot(a[0]-b[0],a[1]-b[1]);};
S.addEventListener('pointerdown',e=>{
  ptr.set(e.pointerId,[e.clientX,e.clientY]);
  if(ptr.size===1){drag={x:e.clientX,y:e.clientY,vx:vb.x,vy:vb.y};moved=false;}
  else{drag=null;pd=pdist();moved=true;}
});
addEventListener('pointermove',e=>{
  if(!ptr.has(e.pointerId))return;
  ptr.set(e.pointerId,[e.clientX,e.clientY]);
  if(ptr.size===2){const d=pdist(),[a,b]=[...ptr.values()];if(pd)zoomAt((a[0]+b[0])/2,(a[1]+b[1])/2,pd/d);pd=d;}
  else if(drag){
    const dx=e.clientX-drag.x,dy=e.clientY-drag.y;
    if(!moved&&Math.hypot(dx,dy)>5)moved=true;
    if(moved){const s=metrics().s;vb.x=drag.vx-dx*s;vb.y=drag.vy-dy*s;draw();}
  }
});
const up=e=>{ptr.delete(e.pointerId);if(ptr.size<2)pd=0;if(!ptr.size)drag=null;};
addEventListener('pointerup',up);addEventListener('pointercancel',up);
S.addEventListener('click',e=>{
  if(moved){moved=false;return;}
  select(e.target.closest('.room,.poi'));
});
S.addEventListener('dblclick',e=>zoomAt(e.clientX,e.clientY,.5));
const hint=$('.fm-hint');let ht;
S.addEventListener('wheel',e=>{
  if(WHEEL_NEEDS_MODIFIER&&!(e.ctrlKey||e.metaKey)&&!R.classList.contains('zoomed')){
    hint.classList.add('on');clearTimeout(ht);ht=setTimeout(()=>hint.classList.remove('on'),1200);return;}
  e.preventDefault();zoomAt(e.clientX,e.clientY,Math.exp(e.deltaY*.0015));
},{passive:false});

/* ---- hover tooltip + keyboard ---- */
S.addEventListener('mouseover',e=>{const t=e.target.closest('.room,.poi');hover(t);tip.textContent=t?t.dataset.name:'';tip.classList.toggle('on',!!t);});
S.addEventListener('mousemove',e=>{const r=R.getBoundingClientRect();tip.style.left=(e.clientX-r.left+14)+'px';tip.style.top=(e.clientY-r.top+14)+'px';});
S.addEventListener('mouseleave',()=>{hover(null);tip.classList.remove('on');});
S.addEventListener('focusin',e=>hover(e.target.closest('.room,.poi')));
S.addEventListener('focusout',()=>hover(null));
R.addEventListener('keydown',e=>{
  if(e.key==='Escape'){select(null);hover(null);return;}
  const t=e.target.closest&&e.target.closest('.room,.poi');
  if(t&&(e.key==='Enter'||e.key===' ')){e.preventDefault();select(t);}
});

draw();apply();
})();
</script>
</body>
</html>
